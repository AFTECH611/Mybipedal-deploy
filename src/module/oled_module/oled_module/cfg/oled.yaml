# =============================================================================
#  oled.yaml  –  Configuration for OledModule
# =============================================================================

# ── OLED hardware ─────────────────────────────────────────────────────────────
i2c_device:        /dev/i2c-7   # I²C bus where SSD1306 is connected
oled_addr:         0x3C         # SSD1306 I²C address (0x3C or 0x3D)
sleep_timeout_sec: 30           # seconds of inactivity before display sleeps

# ── Robot identity ────────────────────────────────────────────────────────────
robot_name: "MyBipedal"

# ── GPIO pins  (Radxa 5B+ default layout) ─────────────────────────────────────
gpio:
  chip_encoder: gpiochip3   # /dev/gpiochip3  for encoder signals
  clk:  13                  # Encoder CLK (A)  – gpiochip3 offset 13
  dt:   15                  # Encoder DT  (B)  – gpiochip3 offset 15
  sw:   16                  # Encoder SW push  – gpiochip3 offset 16
  chip_back: gpiochip4      # /dev/gpiochip4  for back button
  back: 20                  # Back button      – gpiochip4 offset 20

# ── AimRT topics ──────────────────────────────────────────────────────────────
sub_joint_state_name: /joint_states   # sensor_msgs/JointState
sub_imu_data_name:    /imu_data       # sensor_msgs/Imu
sub_joy_name:         /joy_vel        # geometry_msgs/Twist  (cmd_vel)
